name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm and attach tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Test
        run: |
          node test/selftest.mjs
          node test/mcp-handshake.mjs

      - name: Pack
        run: npm pack

      - name: Publish (requires NPM_TOKEN secret)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach tarball to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-synthv-studio-*.tgz
          generate_release_notes: true
