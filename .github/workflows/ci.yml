name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Offline tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate plugin surface and pure logic
        run: node test/selftest.mjs

      - name: Validate bundled MCP server handshake
        run: node test/mcp-handshake.mjs

      - name: Validate npm package contents
        run: |
          npm pack --dry-run
          node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) throw new Error('missing dsh.bundle.patch'); if(p.private) throw new Error('package must be publishable'); console.log('manifest ok', p.name, p.version)"
